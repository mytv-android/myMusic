name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" "build-tools;36.1.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew && ./gradlew test

  release:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" "build-tools;36.1.0"
      - name: Configure signing
        env:
          SIGNING_PROPERTIES: ${{ secrets.SIGNING_PROPERTIES }}
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
        run: |
          if [ -n "$SIGNING_PROPERTIES" ] && [ -n "$SIGN_KEY" ]; then
            echo "$SIGNING_PROPERTIES" | base64 -d > signing.properties
            echo "$SIGN_KEY" | base64 -d > keystore.jks
          fi
      - name: Inspect signing setup
        run: |
          echo "properties bytes: $(wc -c < signing.properties 2>/dev/null || echo 0)"
          echo "keystore bytes: $(wc -c < keystore.jks 2>/dev/null || echo 0)"
          file signing.properties keystore.jks || true
          if grep -aq '^storeFile=' signing.properties; then
            echo "property keys:"
            grep -aE '^[A-Za-z][A-Za-z0-9_.-]*=' signing.properties | cut -d= -f1 | sort -u
            store=$(grep -a '^storeFile=' signing.properties | head -1 | cut -d= -f2- | tr -d '\r')
            echo "storeFile path: $store"
            echo "store exists: $(test -f "$store" && echo yes || echo no)"
          else
            echo "signing.properties has no storeFile key"
          fi
      - name: Signing report
        run: chmod +x ./gradlew && ./gradlew :app:signingReport --no-daemon
      - name: Build release
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: chmod +x ./gradlew && ./gradlew assembleRelease --no-daemon --max-workers=1 -Porg.gradle.jvmargs=-Xmx3g
      - name: Rename APKs
        id: apk
        run: |
          metadata=$(find app/build/outputs/apk/release -name output-metadata.json | head -1)
          version=$(jq -r '.elements[0].versionName' "$metadata")
          code=$(jq -r '.elements[0].versionCode' "$metadata")
          mkdir -p dist
          find app/build/outputs/apk/release -name '*.apk' -exec cp {} dist/ \;
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: myMusic ${{ steps.apk.outputs.version }}
          body: Android 6.0+ 通用安装包。versionCode ${{ steps.apk.outputs.code }}。
          files: dist/*.apk
          prerelease: ${{ github.ref_name != 'main' }}
          make_latest: ${{ github.ref_name == 'main' && 'true' || 'false' }}
